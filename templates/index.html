<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회의자료 취합 시스템</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: #f4f6f9; padding: 30px; color: #333; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    h1 { margin-bottom: 20px; text-align: center; color: #1e293b; }
    .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .card h2 { font-size: 1.2rem; margin-bottom: 15px; color: #334155; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }

    .date-selection { margin-bottom: 20px; max-width: 300px; }
    .date-selection label { font-size: 0.9rem; font-weight: bold; color: #475569; display: block; margin-bottom: 6px; }
    
    .topic-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
    .form-row { display: grid; grid-template-columns: 2fr 3fr auto; gap: 10px; align-items: center; }
    
    input[type="text"], input[type="date"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
    .dept-hint { font-size: 0.8rem; color: #64748b; margin-top: 4px; }

    .btn-add-item { background: #64748b; color: white; padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-bottom: 15px; }
    .btn-remove-item { background: #ef4444; color: white; border: none; border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-weight: bold; }
    .btn-submit-all { background: #2563eb; color: white; border: none; border-radius: 6px; padding: 12px 20px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 0.88rem; }
    th { background-color: #f8fafc; color: #475569; }

    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    .badge-red { background-color: #fee2e2; color: #dc2626; }
    .badge-green { background-color: #dcfce7; color: #16a34a; }
    .badge-blue { background-color: #dbeafe; color: #2563eb; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-red { background-color: #ef4444; }
    .dot-green { background-color: #22c55e; }
    .dot-blue { background-color: #3b82f6; }

    .reason-text { font-size: 0.75rem; color: #64748b; margin-top: 4px; display: block; font-style: italic; }

    .btn-download { background-color: #0284c7; color: white; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
    .btn-delete { background-color: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    
    .merge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
    .btn-merge { width: 100%; padding: 14px; font-size: 1rem; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-merge-ppt { background-color: #059669; }
    .btn-merge-ppt:hover { background-color: #047857; }
    .btn-merge-hwp { background-color: #2563eb; }
    .btn-merge-hwp:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>

<div class="container">
  <h1>📂 회의자료 취합 및 대시보드</h1>

  <div class="card">
    <h2>1. 회의 날짜 지정 및 안건/부서 다중 등록</h2>
    <div class="date-selection">
      <label>회의 날짜 선택</label>
      <input type="date" id="meetingDate">
    </div>
    <div id="topicContainer"></div>
    <button class="btn-add-item" onclick="addTopicRow()">+ 안건 목차 추가하기</button>
    <button class="btn-submit-all" onclick="submitTopics()">회의 안건 전체 등록하기</button>
  </div>

  <div class="card">
    <h2>2. 부서별 제출 현황 대시보드</h2>
    <table>
      <thead>
        <tr>
          <th>회의 날짜</th>
          <th>안건 목차</th>
          <th>제출 부서</th>
          <th>제출 상태 / 사유</th>
          <th>개별 다운로드</th>
          <th>자료 업로드 (PPT, HWP)</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="topicTableBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>3. 회의자료 통합 파일 생성</h2>
    <p style="color: #64748b; margin-bottom: 15px; font-size: 0.9rem;">
      제출 완료된 파일들을 순서대로 자동 병합하여 하나의 통합 파일로 생성합니다.
    </p>
    <div class="merge-grid">
      <button class="btn-merge btn-merge-ppt" onclick="mergePPTs()">📊 PPT 통합본 다운로드</button>
      <button class="btn-merge btn-merge-hwp" onclick="mergeHWPs()">📝 한글(HWP) 통합본 다운로드</button>
    </div>
  </div>
</div>

<script>
  let currentTopics = [];

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('meetingDate').valueAsDate = new Date();
    addTopicRow();
    fetchTopics();
  });

  function addTopicRow() {
    const container = document.getElementById('topicContainer');
    const div = document.createElement('div');
    div.className = 'topic-item';
    div.innerHTML = `
      <div class="form-row">
        <div>
          <input type="text" class="topic-title" placeholder="안건/목차 제목 (예: 3분기 실적 보고)">
        </div>
        <div>
          <input type="text" class="topic-depts" placeholder="제출 대상 부서 (쉼표 구분: 기획팀, 재무팀)">
          <div class="dept-hint">* 쉼표(,)로 구분 시 개별 행이 생성됩니다.</div>
        </div>
        <div>
          <button class="btn-remove-item" onclick="removeTopicRow(this)">X</button>
        </div>
      </div>
    `;
    container.appendChild(div);
  }

  function removeTopicRow(btn) {
    const rows = document.querySelectorAll('.topic-item');
    if (rows.length > 1) {
      btn.closest('.topic-item').remove();
    } else {
      alert('최소 하나의 안건은 작성해야 합니다.');
    }
  }

  async function submitTopics() {
    const meetingDate = document.getElementById('meetingDate').value;
    if (!meetingDate) {
      alert('회의 날짜를 선택해 주세요.');
      return;
    }

    const items = [];
    document.querySelectorAll('.topic-item').forEach(row => {
      const title = row.querySelector('.topic-title').value.trim();
      const deptsStr = row.querySelector('.topic-depts').value.trim();
      if (title && deptsStr) {
        const depts = deptsStr.split(',').map(d => d.trim()).filter(d => d !== '');
        items.push({ title, depts });
      }
    });

    if (items.length === 0) {
      alert('최소 하나 이상의 안건 제목과 부서를 입력해 주세요.');
      return;
    }

    const res = await fetch('/api/topics', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ meeting_date: meetingDate, items })
    });

    const data = await res.json();
    if (data.success) {
      alert('안건이 성공적으로 등록되었습니다.');
      document.getElementById('topicContainer').innerHTML = '';
      addTopicRow();
      fetchTopics();
    }
  }

  async function fetchTopics() {
    const res = await fetch('/api/topics');
    currentTopics = await res.json();
    renderTable(currentTopics);
  }

  async function deleteTopic(topicId) {
    if (!confirm('정말 이 안건을 삭제하시겠습니까?')) return;
    const res = await fetch(`/api/topics/${topicId}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.success) {
      fetchTopics();
    } else {
      alert('삭제 중 오류가 발생했습니다.');
    }
  }

  async function uploadFile(topicId) {
    const fileInput = document.getElementById(`file-${topicId}`);
    if (!fileInput.files[0]) {
      alert('업로드할 PPT 또는 HWP 파일 선택해 주세요.');
      return;
    }

    const topic = currentTopics.find(t => t.id === topicId);
    let reason = "";

    if (topic && (topic.status === '제출완료' || topic.status === '재제출완료')) {
      reason = prompt('재제출 사유를 간단히 입력해 주세요:');
      if (reason === null) return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    formData.append('reason', reason);

    const res = await fetch(`/api/upload/${topicId}`, {
      method: 'POST',
      body: formData
    });

    const data = await res.json();
    if (data.success) {
      alert('파일이 성공적으로 제출되었습니다.');
      fetchTopics();
    } else {
      alert(data.message);
    }
  }

  async function mergePPTs() {
    const response = await fetch('/api/merge', { method: 'POST' });
    if (response.ok) {
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "최종_회의자료_통합본.pptx";
      document.body.appendChild(a);
      a.click();
      a.remove();
    } else {
      const data = await response.json();
      alert(data.message || 'PPT 취합 중 오류가 발생했습니다.');
    }
  }

  async function mergeHWPs() {
    const response = await fetch('/api/merge-hwp', { method: 'POST' });
    if (response.ok) {
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "최종_회의자료_통합본.hwpx";
      document.body.appendChild(a);
      a.click();
      a.remove();
    } else {
      const data = await response.json();
      alert(data.message || '한글 파일 취합 중 오류가 발생했습니다.');
    }
  }

  function renderTable(topics) {
    const tbody = document.getElementById('topicTableBody');
    tbody.innerHTML = '';

    if (topics.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#94a3b8; padding: 20px;">등록된 회의 안건이 없습니다.</td></tr>`;
      return;
    }

    topics.forEach(topic => {
      let statusBadge = `<span class="badge badge-red"><span class="dot dot-red"></span>제출필요</span>`;
      
      if (topic.status === '제출완료') {
        statusBadge = `<span class="badge badge-green"><span class="dot dot-green"></span>제출완료</span>`;
      } else if (topic.status === '재제출완료') {
        statusBadge = `<span class="badge badge-blue"><span class="dot dot-blue"></span>재제출완료</span>`;
      }

      if (topic.reupload_reason) {
        statusBadge += `<span class="reason-text">사유: ${topic.reupload_reason}</span>`;
      }

      const isDone = topic.status === '제출완료' || topic.status === '재제출완료';
      const downloadBtn = isDone
        ? `<a href="/download/single/${topic.id}" class="btn-download">💾 다운로드</a>`
        : `<span style="color:#cbd5e1; font-size:0.8rem;">미제출</span>`;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${topic.meeting_date}</td>
        <td><strong>${topic.title}</strong></td>
        <td>${topic.dept}</td>
        <td>${statusBadge}</td>
        <td>${downloadBtn}</td>
        <td>
          <div style="display:flex; gap: 4px;">
            <input type="file" id="file-${topic.id}" accept=".ppt, .pptx, .hwp, .hwpx" style="font-size:0.75rem; width:160px;">
            <button onclick="uploadFile(${topic.id})" style="padding: 4px 8px; font-size:0.75rem; cursor:pointer;">${isDone ? '재제출' : '업로드'}</button>
          </div>
        </td>
        <td>
          <button class="btn-delete" onclick="deleteTopic(${topic.id})">삭제</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }
</script>

</body>
</html>
