<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회의자료 취합 시스템</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
    }

    body { 
      background-color: #f4f6f9; 
      color: #333; 
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 좌측 사이드바 */
    .sidebar {
      width: 260px;
      background-color: #1e293b;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid #334155;
    }

    .sidebar-header h1 {
      font-size: 1.15rem;
      font-weight: bold;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }

    .nav-menu {
      list-style: none;
      padding: 16px 0;
    }

    .nav-item {
      padding: 14px 20px;
      font-size: 0.95rem;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 4px solid transparent;
      transition: all 0.2s;
    }

    .nav-item:hover {
      background-color: #334155;
      color: #f8fafc;
    }

    .nav-item.active {
      background-color: #0f172a;
      color: #ffffff;
      border-left-color: #3182f6;
      font-weight: bold;
    }

    .sidebar-contact {
      padding: 20px;
      border-top: 1px solid #334155;
      background-color: #0f172a;
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    .sidebar-contact strong {
      color: #e2e8f0;
    }

    .sidebar-contact a {
      color: #38bdf8;
      text-decoration: none;
    }

    /* 메인 콘텐츠 */
    .main-content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .page-section {
      display: none;
    }

    .page-section.active {
      display: block;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      color: #475569;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="date"], select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #1e293b;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #3182f6;
    }

    .topic-row {
      display: grid;
      grid-template-columns: 2fr 3fr auto;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    .btn {
      padding: 9px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    .btn-primary { background-color: #3182f6; color: white; }
    .btn-primary:hover { background-color: #1d4ed8; }

    .btn-secondary { background-color: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background-color: #cbd5e1; }

    .btn-danger { background-color: #ef4444; color: white; }
    .btn-danger:hover { background-color: #dc2626; }

    .btn-success { background-color: #10b981; color: white; }
    .btn-success:hover { background-color: #059669; }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      background: #f8fafc;
      padding: 14px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      margin-bottom: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th, td {
      padding: 11px 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      word-break: break-all;
    }

    th {
      background-color: #f1f5f9;
      color: #334155;
      font-weight: bold;
      border-top: 1px solid #cbd5e1;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .status-tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 0.78rem;
      font-weight: bold;
    }

    .tag-red { background-color: #fee2e2; color: #dc2626; }
    .tag-green { background-color: #d1fae5; color: #059669; }
    .tag-blue { background-color: #dbeafe; color: #2563eb; }

    .merge-box {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .filename-text {
      font-size: 0.82rem;
      color: #0f172a;
      font-weight: 600;
    }

    .feedback-content-preview {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 4px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <!-- 좌측 사이드바 -->
  <div class="sidebar">
    <div>
      <div class="sidebar-header">
        <h1>📂 회의자료 취합 시스템</h1>
      </div>
      <ul class="nav-menu">
        <li class="nav-item active" onclick="switchTab('tab-dashboard')">
          📊 부서별 제출 현황 대시보드
        </li>
        <li class="nav-item" onclick="switchTab('tab-add')">
          ➕ 회의 안건 목차 추가
        </li>
        <li class="nav-item" onclick="switchTab('tab-feedback')">
          💬 의견 제출 게시판
        </li>
      </ul>
    </div>

    <!-- 고정 문의처 -->
    <div class="sidebar-contact">
      <div style="margin-bottom: 4px;"><strong>[시스템 문의처]</strong></div>
      하연희 주임연구원<br>
      Tel. <strong>031-470-1638</strong><br>
      E-mail. <a href="mailto:yhee@ktc.re.kr">yhee@ktc.re.kr</a>
    </div>
  </div>

  <!-- 우측 메인 콘텐츠 -->
  <div class="main-content">

    <!-- 1. 부서별 제출 현황 대시보드 (체크박스 및 파일명 칸 반영) -->
    <div id="tab-dashboard" class="page-section active">
      <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center;" class="panel-title">
          <span>부서별 제출 현황 대시보드</span>
          <span style="font-size: 0.82rem; font-weight: normal; color: #64748b;">* 취합할 항목을 선택(체크) 후 하단 통합 버튼을 눌러주세요.</span>
        </div>
        
        <!-- 검색 필터 -->
        <div class="filter-grid">
          <div>
            <label>📅 회의 날짜</label>
            <select id="filterDate" onchange="applyFilters()">
              <option value="">전체 날짜</option>
            </select>
          </div>
          <div>
            <label>📌 안건 목차</label>
            <select id="filterTitle" onchange="applyFilters()">
              <option value="">전체 목차</option>
            </select>
          </div>
          <div>
            <label>🏢 제출 부서</label>
            <select id="filterDept" onchange="applyFilters()">
              <option value="">전체 부서</option>
            </select>
          </div>
          <div>
            <label>💡 제출 상태</label>
            <select id="filterStatus" onchange="applyFilters()">
              <option value="">전체 상태</option>
              <option value="제출필요">제출필요</option>
              <option value="제출완료">제출완료</option>
              <option value="재제출완료">재제출완료</option>
            </select>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th style="width: 36px; text-align: center;">
                <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)">
              </th>
              <th style="width: 95px;">회의 날짜</th>
              <th style="width: 150px;">안건 목차</th>
              <th style="width: 100px;">제출 부서</th>
              <th style="width: 110px;">제출 상태 / 사유</th>
              <th>첨부 파일명</th>
              <th style="width: 90px;">다운로드</th>
              <th style="width: 200px;">파일 업로드</th>
              <th style="width: 50px;">관리</th>
            </tr>
          </thead>
          <tbody id="topicTableBody"></tbody>
        </table>

        <!-- 체크한 항목만 통합본 생성 버튼 -->
        <div class="merge-box">
          <button class="btn btn-success" onclick="mergeSelectedPPTs()">📊 선택한 PPT 통합본 다운로드</button>
          <button class="btn btn-primary" onclick="mergeSelectedHWPs()">📝 선택한 한글(HWP) 통합본 다운로드</button>
        </div>
      </div>
    </div>

    <!-- 2. 회의 안건 목차 추가 창 -->
    <div id="tab-add" class="page-section">
      <div class="panel">
        <div class="panel-title">회의 안건 목차 추가</div>
        <div class="form-group" style="max-width: 250px;">
          <label>회의 날짜 선택</label>
          <input type="date" id="meetingDate">
        </div>
        <div id="topicContainer"></div>
        <button class="btn btn-secondary" onclick="addTopicRow()" style="margin-bottom: 20px;">+ 목차 항목 추가</button>
        <button class="btn btn-primary" onclick="submitTopics()" style="width: 100%;">회의 안건 전체 등록</button>
      </div>
    </div>

    <!-- 3. 의견 제출 게시판 창 -->
    <div id="tab-feedback" class="page-section">
      <div class="panel">
        <div class="panel-title">의견 제출하기</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
          <div>
            <label>작성 날짜</label>
            <input type="date" id="fbDate">
          </div>
          <div>
            <label>소속 부서명</label>
            <input type="text" id="fbDept" placeholder="예: 기획팀">
          </div>
          <div>
            <label>작성자 성명</label>
            <input type="text" id="fbName" placeholder="예: 홍길동">
          </div>
        </div>
        <div class="form-group">
          <label>의견 제목</label>
          <input type="text" id="fbTitle" placeholder="의견 제목을 입력해 주세요.">
        </div>
        <div class="form-group">
          <label>상세 의견 내용</label>
          <textarea id="fbContent" rows="4" placeholder="개선 사항이나 요청 내용을 자유롭게 작성해 주세요."></textarea>
        </div>
        <button class="btn btn-primary" onclick="submitFeedback()" style="width: 100%;">의견 등록하기</button>
      </div>

      <div class="panel">
        <div class="panel-title">등록된 의견 목록</div>
        <table>
          <thead>
            <tr>
              <th style="width: 120px;">작성 날짜</th>
              <th style="width: 120px;">부서명</th>
              <th style="width: 100px;">작성자</th>
              <th>제목 및 내용</th>
            </tr>
          </thead>
          <tbody id="feedbackTableBody"></tbody>
        </table>
      </div>
    </div>

  </div>

<script>
  let currentTopics = [];

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('meetingDate').valueAsDate = new Date();
    document.getElementById('fbDate').valueAsDate = new Date();
    addTopicRow();
    fetchTopics();
    fetchFeedback();
  });

  function switchTab(tabId) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));

    event.currentTarget.classList.add('active');
    document.getElementById(tabId).classList.add('active');
  }

  /* --- 안건 등록 --- */
  function addTopicRow() {
    const container = document.getElementById('topicContainer');
    const div = document.createElement('div');
    div.className = 'topic-row';
    div.innerHTML = `
      <input type="text" class="topic-title" placeholder="안건/목차 제목">
      <input type="text" class="topic-depts" placeholder="제출 부서 (쉼표 구분: 기획팀, 재무팀)">
      <button class="btn btn-danger" onclick="removeTopicRow(this)">✕</button>
    `;
    container.appendChild(div);
  }

  function removeTopicRow(btn) {
    const rows = document.querySelectorAll('.topic-row');
    if (rows.length > 1) {
      btn.closest('.topic-row').remove();
    } else {
      alert('최소 하나의 안건은 작성해야 합니다.');
    }
  }

  async function submitTopics() {
    const meetingDate = document.getElementById('meetingDate').value;
    if (!meetingDate) return alert('회의 날짜를 선택해 주세요.');

    const items = [];
    document.querySelectorAll('.topic-row').forEach(row => {
      const title = row.querySelector('.topic-title').value.trim();
      const deptsStr = row.querySelector('.topic-depts').value.trim();
      if (title && deptsStr) {
        const depts = deptsStr.split(',').map(d => d.trim()).filter(d => d !== '');
        items.push({ title, depts });
      }
    });

    if (items.length === 0) return alert('안건 제목과 부서를 입력해 주세요.');

    const res = await fetch('/api/topics', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ meeting_date: meetingDate, items })
    });

    const data = await res.json();
    if (data.success) {
      alert('안건이 등록되었습니다.');
      document.getElementById('topicContainer').innerHTML = '';
      addTopicRow();
      fetchTopics();
      switchTab('tab-dashboard');
    }
  }

  /* --- 대시보드 --- */
  async function fetchTopics() {
    const res = await fetch('/api/topics');
    currentTopics = await res.json();
    populateFilterOptions(currentTopics);
    applyFilters();
  }

  function populateFilterOptions(topics) {
    const dateSelect = document.getElementById('filterDate');
    const titleSelect = document.getElementById('filterTitle');
    const deptSelect = document.getElementById('filterDept');

    const selectedDate = dateSelect.value;
    const selectedTitle = titleSelect.value;
    const selectedDept = deptSelect.value;

    const dates = [...new Set(topics.map(t => t.meeting_date))].sort().reverse();
    const titles = [...new Set(topics.map(t => t.title))].sort();
    const depts = [...new Set(topics.map(t => t.dept))].sort();

    dateSelect.innerHTML = '<option value="">전체 날짜</option>' + dates.map(d => `<option value="${d}">${d}</option>`).join('');
    titleSelect.innerHTML = '<option value="">전체 목차</option>' + titles.map(t => `<option value="${t}">${t}</option>`).join('');
    deptSelect.innerHTML = '<option value="">전체 부서</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');

    dateSelect.value = selectedDate;
    titleSelect.value = selectedTitle;
    deptSelect.value = selectedDept;
  }

  function applyFilters() {
    const fDate = document.getElementById('filterDate').value;
    const fTitle = document.getElementById('filterTitle').value;
    const fDept = document.getElementById('filterDept').value;
    const fStatus = document.getElementById('filterStatus').value;

    const filtered = currentTopics.filter(topic => {
      const matchDate = !fDate || topic.meeting_date === fDate;
      const matchTitle = !fTitle || topic.title === fTitle;
      const matchDept = !fDept || topic.dept === fDept;
      const matchStatus = !fStatus || topic.status === fStatus;
      return matchDate && matchTitle && matchDept && matchStatus;
    });

    renderTable(filtered);
  }

  function renderTable(topics) {
    const tbody = document.getElementById('topicTableBody');
    tbody.innerHTML = '';
    document.getElementById('selectAll').checked = false;

    if (topics.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:#94a3b8; padding: 20px;">등록 및 조회된 안건이 없습니다.</td></tr>`;
      return;
    }

    topics.forEach(topic => {
      let statusBadge = `<span class="status-tag tag-red">제출필요</span>`;
      if (topic.status === '제출완료') statusBadge = `<span class="status-tag tag-green">제출완료</span>`;
      else if (topic.status === '재제출완료') statusBadge = `<span class="status-tag tag-blue">재제출완료</span>`;

      if (topic.reupload_reason) {
        statusBadge += `<div style="font-size:0.75rem; color:#64748b; margin-top:2px;">사유: ${topic.reupload_reason}</div>`;
      }

      const isDone = topic.status === '제출완료' || topic.status === '재제출완료';
      const downloadBtn = isDone
        ? `<a href="/download/single/${topic.id}" class="btn btn-secondary" style="font-size:0.75rem; padding:4px 8px; text-decoration:none;">💾 다운로드</a>`
        : `<span style="color:#cbd5e1; font-size:0.8rem;">미제출</span>`;

      const fileName = topic.original_filename 
        ? `<span class="filename-text">📎 ${topic.original_filename}</span>` 
        : `<span style="color:#cbd5e1; font-size:0.8rem;">-</span>`;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="text-align:center;">
          <input type="checkbox" class="topic-checkbox" value="${topic.id}">
        </td>
        <td>${topic.meeting_date}</td>
        <td><strong>${topic.title}</strong></td>
        <td>${topic.dept}</td>
        <td>${statusBadge}</td>
        <td>${fileName}</td>
        <td>${downloadBtn}</td>
        <td>
          <div style="display:flex; gap: 4px;">
            <input type="file" id="file-${topic.id}" accept=".ppt, .pptx, .hwp, .hwpx" style="font-size:0.75rem; width:130px;">
            <button class="btn btn-primary" onclick="uploadFile(${topic.id})" style="padding:4px 8px; font-size:0.75rem;">${isDone ? '재제출' : '업로드'}</button>
          </div>
        </td>
        <td>
          <button class="btn btn-danger" onclick="deleteTopic(${topic.id})" style="padding:4px 8px; font-size:0.75rem;">삭제</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function toggleSelectAll(masterCert) {
    const checkboxes = document.querySelectorAll('.topic-checkbox');
    checkboxes.forEach(cb => cb.checked = masterCert.checked);
  }

  function getSelectedIds() {
    const checkboxes = document.querySelectorAll('.topic-checkbox:checked');
    return Array.from(checkboxes).map(cb => parseInt(cb.value));
  }

  /* --- 선택한 파일 취합 기능 --- */
  async function mergeSelectedPPTs() {
    const selectedIds = getSelectedIds();
    if (selectedIds.length === 0) {
      alert('취합할 항목을 하나 이상 체크해 주세요.');
      return;
    }

    const response = await fetch('/api/merge', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: selectedIds })
    });

    if (response.ok) {
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "선택_회의자료_통합본.pptx";
      a.click();
    } else {
      const data = await response.json();
      alert(data.message || 'PPT 취합 중 오류가 발생했습니다.');
    }
  }

  async function mergeSelectedHWPs() {
    const selectedIds = getSelectedIds();
    if (selectedIds.length === 0) {
      alert('취합할 항목을 하나 이상 체크해 주세요.');
      return;
    }

    const response = await fetch('/api/merge-hwp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: selectedIds })
    });

    if (response.ok) {
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "선택_회의자료_통합본.hwpx";
      a.click();
    } else {
      const data = await response.json();
      alert(data.message || '한글 파일 취합 중 오류가 발생했습니다.');
    }
  }

  async function uploadFile(topicId) {
    const fileInput = document.getElementById(`file-${topicId}`);
    if (!fileInput.files[0]) return alert('파일을 선택해 주세요.');

    const topic = currentTopics.find(t => t.id === topicId);
    let reason = "";

    if (topic && (topic.status === '제출완료' || topic.status === '재제출완료')) {
      reason = prompt('재제출 사유를 입력해 주세요:');
      if (reason === null) return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    formData.append('reason', reason);

    const res = await fetch(`/api/upload/${topicId}`, { method: 'POST', body: formData });
    const data = await res.json();
    if (data.success) {
      alert('제출되었습니다.');
      fetchTopics();
    } else {
      alert(data.message);
    }
  }

  async function deleteTopic(topicId) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    const res = await fetch(`/api/topics/${topicId}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.success) fetchTopics();
  }

  /* --- 의견 제출 --- */
  async function submitFeedback() {
    const submit_date = document.getElementById('fbDate').value;
    const dept = document.getElementById('fbDept').value.trim();
    const name = document.getElementById('fbName').value.trim();
    const title = document.getElementById('fbTitle').value.trim();
    const content = document.getElementById('fbContent').value.trim();

    if (!submit_date || !dept || !name || !title || !content) {
      return alert('모든 항목을 작성해 주세요.');
    }

    const res = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ submit_date, dept, name, title, content })
    });

    const data = await res.json();
    if (data.success) {
      alert('의견이 등록되었습니다.');
      document.getElementById('fbTitle').value = '';
      document.getElementById('fbContent').value = '';
      fetchFeedback();
    }
  }

  async function fetchFeedback() {
    const res = await fetch('/api/feedback');
    const feedbacks = await res.json();
    const tbody = document.getElementById('feedbackTableBody');
    tbody.innerHTML = '';

    if (feedbacks.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#94a3b8; padding:20px;">등록된 의견이 없습니다.</td></tr>`;
      return;
    }

    feedbacks.forEach(fb => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${fb.submit_date}</td>
        <td>${fb.dept}</td>
        <td>${fb.name}</td>
        <td>
          <strong style="color:#1e293b;">${fb.title}</strong>
          <div class="feedback-content-preview">${fb.content}</div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }
</script>
